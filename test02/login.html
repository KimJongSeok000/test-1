<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            margin: 0 auto;
            display: flex;
            width: 500px;
            height: 500px;
            border: 1px solid black;
            align-items: center;
            justify-items: center;
        }

        .login {
            background-color: darkgreen;
            display: flex;
            flex-direction: column;
            height: 90%;
            width: 90%;
            text-align: center;
            margin: auto;
            justify-content: space-around;
        }

        #welcom {
            color: white;
            font-size: 30px;
        }

        .inputlog {
            background-color: transparent;
        }

        .loginbutt {
            background-color: forestgreen;
            color: white;
        }

        #butttext {
            color: white;
        }

        #inputid {
            width: 400px;
            height: 40px;
            border: 1px solid rgb(110, 125, 110);
            padding: 10px 60px 10px 10px;
            background-color: transparent;
        }

        #inputpass {
            width: 400px;
            height: 40px;
            border: 1px solid rgb(110, 125, 110);
            padding: 10px 60px 10px 10px;
            background-color: transparent;
            margin: 10px;
        }


        button {
            width: 400px;
            height: 50px;
            border: none;
        }
    </style>
</head>

<body>
    <form action="main.html">
        <div class="container">
            <div class="login">
                <div id="welcom">
                    <p>Welcome Back!</p>
                </div>
                <div class="inputlog">
                    <div>
                        <input id="inputid" placeholder="Email addres*" type="email">
                    </div>
                    <div>
                        <input id="inputpass" placeholder="Password*" type="password">
                    </div>
                </div>
                <div>
                    <button type="submit" class="loginbutt">
                        LOG IN
                    </button>
                </div>
            </div>
        </div>
    </form>

</body>

</html>
